# Signs the unchanged catalog again, with `serial` + 1, by hand only (Actions → Run workflow),
# after the `release` environment's reviewer approves. A catalog never expires, so this is not a
# routine task: it is for a key rotation (README.PLUGINS.md §6.4 in RedAmon), so the catalog is
# signed with the new key at once instead of at the next release.
name: Catalog re-sign

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resign:
    name: Re-sign the catalog
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: catalog
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install the pinned tools
        run: pip install --no-cache-dir --disable-pip-version-check --no-deps -r tools/requirements-tools.txt

      - name: Raise the serial
        run: python tools/catalog.py resign

      - name: Sign the catalog
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          CATALOG_SIGNING_KEY_ID: ${{ secrets.CATALOG_SIGNING_KEY_ID }}
        run: python tools/sign.py catalog.json

      - name: Commit the catalog to master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog.json.sig
          git commit -m "chore(catalog): re-sign"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
